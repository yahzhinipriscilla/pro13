<div class="ef-box">
  <h2>Fleet Maintenance Tasks</h2>
  <input type="text" class="ef-in" id="taskInput" placeholder="e.g. Inspect charger #4">
  <button class="ef-btn" onclick="addTask()">Add</button>
  <ul id="taskList"></ul>
</div>

<footer>
  <p>Copyright 2026 by ecofleet Data. All Rights Reserved.</p>
</footer>

<script>
var tasks = [
  { text: "Check battery health of Bus 3", done: false },
  { text: "Service charging station A", done: false }
];
function render() {                                   // READ
  var list = document.getElementById("taskList");
  list.innerHTML = "";
  tasks.forEach(function (t, i) {
    var li = document.createElement("li");
    if (t.done) { li.className = "done"; }
    li.innerHTML = '<input type="checkbox" ' + (t.done ? "checked" : "") + ' onclick="toggleTask(' + i + ')">' +
      '<span></span>' +
      '<button class="ef-btn ef-edit" onclick="editTask(' + i + ')">Edit</button>' +
      '<button class="ef-btn ef-del" onclick="deleteTask(' + i + ')">Delete</button>';
    li.querySelector("span").textContent = t.text;
    list.appendChild(li);
  });
}
function addTask() {                                  // CREATE
  var input = document.getElementById("taskInput");
  var text = input.value.trim();
  if (text == "") { alert("Please enter a task."); return; }
  tasks.push({ text: text, done: false });
  input.value = "";
  render();
}
function editTask(i) {                                // UPDATE
  var t = prompt("Edit task:", tasks[i].text);
  if (t !== null && t.trim() != "") { tasks[i].text = t.trim(); render(); }
}
function toggleTask(i) { tasks[i].done = !tasks[i].done; render(); }
function deleteTask(i) { tasks.splice(i, 1); render(); }  // DELETE
render();
</script>
